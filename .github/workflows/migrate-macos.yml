name: migrate-macos

on:
  push:
    branches: [master, "land/**"]
    paths: ["code/ops/migrate/**", ".github/workflows/migrate-macos.yml"]
  pull_request:
    branches: [master]
    paths: ["code/ops/migrate/**", ".github/workflows/migrate-macos.yml"]

permissions:
  contents: read

jobs:
  migrate-macos:
    runs-on: macos-14
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Migrate tool suites
        run: |
          python3 -m pip install duckdb==1.5.6 markdown-it-py==3.0.0
          PYTHONPATH=code/tests:code LLMDB_ROOT="$PWD" python3 -B -m unittest discover -s code/ops/migrate -p 'test_*.py'
