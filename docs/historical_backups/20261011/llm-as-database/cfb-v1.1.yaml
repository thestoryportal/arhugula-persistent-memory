      origin: "Session 2.4 §1.5 (template-sensitivity scope)"
      status: "Deferred to v2"
      resolves_at: "Stage 2 sweep design (Session 2.7+)"
      content: |
        CFB v1 includes one canonical template and one variant template.
        Stage 2 template-sensitivity sweep with two template classes can only
        distinguish "canonical works / variant fails" or vice versa. CFB v2
        may warrant a third template class for gradient-style analysis.

    - id: "OQ-S25-5"
      origin: "Session 2.5 §3 (variant-template empirical capture)"
      status: "Open"
      resolves_at: "Stage 2 sweep design (Session 2.7+)"
      content: |
        Variant-template baseline-prior weakness. Empirical capture:
        - cfb-004: P(California|"Tom Brady was born in") = 0.012 (weak)
        - cfb-005: P(Michigan|"Serena Williams was born in") = 0.000014 (severe)
        GPT-J 6B interprets "born in" as primarily temporal (year-completion),
        not geographic (state-completion). Stage 2 sweep design must address:
        either revise variant-template prompts to disambiguate
        ("X was born in the state of"), or treat weak-baseline-prior as a
        sweep variable. Affects only Stage 2; cfb-004/005 are not stage_1_eligible.

    - id: "OQ-S25-7"
      origin: "Session 2.5 §3 (subject token ID extraction; multi-token BPE behavior)"
      status: "Open"
      resolves_at: "Stage 1 retrospective (Session 2.7)"
      content: |
        MEMIT subject_last anchoring on BPE fragments for multi-token subjects.
        Subject token counts vary widely across CFB v1.1:
        - cfb-001 ' Jordan': 2 tokens, subject_last = ' Jordan' (id 8078)
        - cfb-002/004 ' Brady': 2 tokens, subject_last = ' Brady' (id 15260)
        - cfb-003 'Way ne  Gret z ky': 5 tokens, subject_last = 'ky' (id 2584)
        - cfb-005 'S ere na  Williams': 4 tokens, subject_last = ' Williams' (id 6484)
        For cfb-003, MEMIT's edit keys on the BPE suffix 'ky' rather than a
        clean word boundary. Standard MEMIT behavior; original Meng et al.
        2023 paper acknowledges this. Stage 1 retrospective should compare
        cfb-003's edit-magnitude against cfb-001/002 to test whether BPE
        fragmentation systematically affects edit fidelity. If yes,
        BPE-fragmentation-class becomes a Stage 2 sweep variable.

