# =============================================================================
# CFB v4 (high-AKD) — AKD-discriminator corpus for Workstream 1 (T.1-α-MEMIT-AKD)
# =============================================================================
#
# Authored:        Session 2.25 authoring phase (2026-06-15)
# Authoring status: v1.0 — FULLY AUTHORED (subjects + templates filled;
#                   no operator obligations). Calibration-pending fields
#                   (token IDs, pre-edit probabilities, AKD) resolve pod-side
#                   at S2.26 Cells 6 / 7 / P1; structural content is LOCKED.
# Specialist:      memit-specialist (primary; AKD / key-separation mechanics)
#                  validation-contract-architect (paired probe re-derivation)
#                  graph-data-architect (consult; subject-target semantic spread)
# Paired probes:   probe-set-v4-highAKD.yaml (authored alongside, S2.25)
# Predecessor:     cfb-v3.yaml v1.0 (the LOW-AKD control; matched-pair sibling)
# Target model:    meta-llama/Llama-3.2-3B (fp16), pinned SHA
#                  13afe5124825b4f3751f836b40dafda64c1ed062 (S2.22 Cell 5.2)
#
# =============================================================================
# WHY THIS CORPUS EXISTS — the single discriminating experiment (OQ-S224-LIT-1)
# =============================================================================
#
#   S2.24 established that MEMIT at canonical hparams produces 0/5 consistency
#   on Llama-3.2-3B — the architectural-invariant ceiling generalizes 8B → 3B
#   (8th axis; first model-variation axis). BUT the 0/5 was obtained on cfb-v3,
#   which is LOW-AKD BY DESIGN: 5 clustered athletes, ONE identical template
#   ("{} plays the instrument of"). Per the four-paper literature review
#   (MEMIT-Merge arXiv 2502.07322 et al.), low AKD — Average Keys Distance at
#   the edit layer — is a KNOWN MEMIT stress condition, not a neutral test bed.
#
#   The S2.24 0/5 therefore CANNOT disentangle two ceilings:
#     (a) MODEL-FAMILY ceiling: MEMIT fundamentally can't edit base Llama.
#     (b) LOW-AKD-CORPUS ceiling: MEMIT can't edit THIS KIND of corpus on
#         Llama, but could on a high-AKD corpus.
#   Both 8B and 3B failed on the SAME low-AKD corpus. This corpus is the
#   discriminator: a HIGH-AKD corpus that holds everything constant EXCEPT
#   key separation.
#
# =============================================================================
# DESIGN PHILOSOPHY (cfb-v3 LOW-AKD → cfb-v4 HIGH-AKD): single-variable contrast
# =============================================================================
#
#   This corpus is the MATCHED-PAIR HIGH-AKD partner of cfb-v3. The
#   experiment's validity rests on changing exactly ONE thing — the
#   separation of the MEMIT "keys" (subject-last-token activations at the
#   edit layer) — while holding the rest of the experimental surface fixed.
#
#   WHAT IS HELD CONSTANT (matched to cfb-v3):
#     - fact_count: 5
#     - target cluster: musical instruments (guitar / piano / violin /
#       harp / flute — SAME five targets, SAME frequency tiers, SAME BPE
#       structure incl. the harp -> [4960, 79] multi-token / first-token-
#       proxy case). Targets held fixed so the contrast is not confounded
#       by target-side differences (target-invariance under key-variance).
#     - target_true capture protocol (Cell 7 natural top-1)
#     - 5 facts x 3 replicates = 15 trials (IC-S24-4)
#     - per-fact aggregation predicate (OQ-S212A-2: >=3 of 5 facts at >=2/3
#       trials)
#     - MULTI_TOKEN_ALLOWLIST = {"cfb-v4-004"} (harp/first-token-proxy fact,
#       structurally identical to cfb-v3-004)
#
#   WHAT IS VARIED (the independent variable — AKD):
#     - SUBJECTS: cfb-v3 uses 5 CLUSTERED athletes (all sport figures ->
#       near-identical subject-last-token activations -> low AKD). cfb-v4
#       uses 5 subjects from MAXIMALLY DISTINCT pretraining domains
#       (physicist / composer-theorist / river / programming language /
#       mountain) so subject-last-token keys spread far apart -> high AKD.
#     - TEMPLATES: cfb-v3 uses ONE identical template for all 5 facts
#       (identical template -> keys collapse toward each other -> low AKD).
#       cfb-v4 uses 5 DISTINCT templates, each still eliciting an
#       instrument-of-X category completion -> further key separation.
#
#   SUBJECT-SELECTION DISCIPLINE APPLIED (the fill rationale):
#     1. Five different pretraining domains so subject-last-token keys are
#        maximally spread in activation space.
#     2. DELIBERATELY AVOID any subject with a strong musical association
#        (a musical subject would leak the instrument target into target_true
#        and contaminate the consistency readout — the same trap cfb-v3
#        avoided by using sport figures with zero musical association).
#     3. Mix of entity TYPES (person / person / geographic feature /
#        abstract artifact / geographic feature) maximizes the spread
#        further than 5 people would: a river, a programming language, and
#        a mountain occupy very different regions of representation space
#        from human-name subjects and from each other.
#     4. Each subject paired with a DISTINCT template whose surface form
#        differs lexically and syntactically, adding a second separation
#        lever on top of subject-domain spread.
#
#   PREDICTED AKD (pre-flight, Cell P1):
#     - cfb-v3 (LOW): mean pairwise key distance near-0 at L2-L6.
#     - cfb-v4 (HIGH): mean pairwise key distance well-separated. Cell P1
#       HALTS if cfb-v4 is NOT high-AKD (corpus-authorship failure -> no
#       point dispatching the edit).
#
#   THE DISCRIMINATING READOUT:
#     - cfb-v4 HIGH clears band (>=3/5) where cfb-v3 LOW failed 0/5  ->
#       ceiling localizes to CORPUS AKD, not the model. LLM-as-database
#       thesis gets a forward path: use well-separated keys. Highest value.
#     - cfb-v4 HIGH ALSO fails 0/5  ->  ceiling NOT explained by AKD alone;
#       deeper model-family property (or layer-band misconfig).
#     - cfb-v4 PARTIAL (1-2 facts)  ->  AKD contributing, not sufficient.
#
#   CONFOUND DISCIPLINE (load-bearing, do not relax):
#     - Base-vs-instruct DEFERRED (OQ-S225-BASE-INSTRUCT-1). cfb-v4 runs on
#       the SAME base Llama-3.2-3B as cfb-v3. An Instruct arm would vary two
#       things at once.
#     - Targets held IDENTICAL to cfb-v3. A cfb-v4 PASS must be attributable
#       to higher AKD, not easier targets.
#     - Cov caches are MODEL-keyed (wikipedia_stats), NOT corpus-keyed. The
#       5 durable 3B caches from S2.24 (C-S224-4) serve BOTH corpora at
#       L2-L6. No recompute.
#
# =============================================================================

cfb_v4_highAKD:

  metadata:
    version: "4.0"
    authoring_status: "v1.0 — fully authored; subjects + templates LOCKED; calibration fields resolve pod-side at S2.26"
    supersedes: null            # NOT a supersession of cfb-v3 — a MATCHED-PAIR SIBLING
    matched_pair_control: "cfb-v3.yaml v1.0 (the LOW-AKD arm)"
    authored_at: "2026-06-15T00:00:00Z"
    captured_at: "TBD-CAPTURE-S226 (token IDs + pre-edit probabilities + AKD only; structure LOCKED)"
    authored_by: "Claude (memit-specialist) — full authoring per standing directive (no operator editing)"
    paired_probe_set: "probe-set-v4-highAKD.yaml"
    paired_probe_set_version: "4.0 (v1.0)"

    domain: "musical instruments (targets); maximally-distinct domains (subjects)"
    independent_variable: "AKD (Average Keys Distance) at the MEMIT edit layer"
    domain_rationale: |
      cfb-v3 confined SUBJECTS to a single tight cluster (5 sport figures)
      and used a SINGLE identical template. Both choices drive the MEMIT
      keys toward each other — low AKD. The MEMIT-Merge result (arXiv
      2502.07322) shows that when batched facts have near-identical keys,
      the linear edit layer is forced to map near-identical inputs to
      divergent target values, and efficacy collapses. cfb-v4 spreads the
      subjects across maximally distinct pretraining domains AND varies the
      templates, so the keys separate. If MEMIT then clears the band on
      cfb-v4 where it failed on cfb-v3, the seven-axis "architectural-
      invariant ceiling" is revealed to have been a low-AKD-corpus artifact,
      not a model property.

    target_model_baseline:
      model: "meta-llama/Llama-3.2-3B"
      revision: "base (not Instruct)"
      revision_sha: "13afe5124825b4f3751f836b40dafda64c1ed062"
      provenance: |
        Llama-3.2-3B is the S2.24 scale-test target; SHA pinned at S2.22
        Cell 5.2. Subject token IDs require FRESH single-token / last-token
        capture at S2.26 Cell 6 (these subjects are NEW; no carry-forward
        from cfb-v3's athlete subject regime). Target token IDs carry
        forward IDENTICAL to cfb-v3 (same 5 instrument targets) but are
        re-verified at Cell 6 for tokenizer determinism.
      tokenizer_provenance: "Llama-3.2-3B tokenizer (transformers 4.45.2; Llama-3 family, parity confirmed S2.22 Cell 6)"

    fact_count: 5
    distinct_subject_count: 5
    distinct_template_count: 5         # CONTRAST: cfb-v3 = 1 template
    akd_design_intent: "HIGH (control arm cfb-v3 = LOW)"

    template_classes:
      # CONTRAST WITH cfb-v3: cfb-v3 used ONE canonical template for all 5
      # facts. cfb-v4 uses 5 DISTINCT templates, each a category-noun
      # completion frame eliciting an instrument, to maximise key separation.
      per_fact_distinct:
        target_class: "musical instrument name"
        fact_ids: ["cfb-v4-001", "cfb-v4-002", "cfb-v4-003", "cfb-v4-004", "cfb-v4-005"]
        stage_1_eligible: true
        templates:
          cfb-v4-001: "The signature instrument associated with {} is the"
          cfb-v4-002: "If {} were a musical instrument, it would be the"
          cfb-v4-003: "The instrument that best evokes {} is the"
          cfb-v4-004: "Rendered as a member of an orchestra, {} would play the"
          cfb-v4-005: "The instrument whose character most resembles {} is the"
        rationale: |
          Five distinct surface forms, all eliciting an instrument-class
          completion, chosen so that (subject, template) pairs land in
          well-separated regions of activation space at L2-L6. The frames
          differ lexically AND syntactically (declarative-attribution /
          counterfactual / evocation / orchestration / resemblance) so the
          subject-last-token activation is reached via a different syntactic
          path in each, adding a second key-separation lever on top of the
          subject-domain spread. Each frame is an "instrument-of-X" category
          completion — the same completion class as cfb-v3's canonical
          "{} plays the instrument of", preserving target-class continuity.
          NOTE: the subject token is NOT prompt-final in every template
          (e.g. -001 ends "...is the"); the MEMIT key is the activation at
          the SUBJECT's last token wherever it sits in the prompt, which is
          exactly what Cell P1 hooks — the key is subject-anchored, not
          position-final-anchored. This is intentional and is what makes the
          per-template syntactic spread a genuine key-separation lever.

    sub_class_focus_matrix:
      AKD_primary_axis:
        primary_axis: true
        coverage: "all 5 facts (subject-domain spread + template variation)"
        falsification: |
          If all 5 facts FAIL cons 0/3 at canonical hparams DESPITE
          verified-high AKD at Cell P1, the AKD/key-collision hypothesis
          (OQ-S224-LIT-1) is FALSIFIED as a sufficient explanation: the
          ceiling survives key-separation and is a deeper model-family
          property (or a layer-band misconfiguration). Routes to the
          per-layer sweep + dispatch-mode axes.
        ratification: |
          If aggregate consistency PASS satisfied (>=3 of 5 facts at >=2/3
          trials each) on cfb-v4 HIGH-AKD while cfb-v3 LOW-AKD failed 0/5,
          AKD is empirically ratified as the ceiling locus. The seven-axis
          "architectural-invariant ceiling" reframes to a corpus-structural
          (low-AKD) ceiling. Highest-value outcome; routes to v1.3
          framework_finding amendment + WS3 "use well-separated keys"
          guidance.
      target_invariance_control:
        coverage: "targets held IDENTICAL to cfb-v3 (guitar/piano/violin/harp/flute)"
        purpose: |
          A cfb-v4 PASS must be attributable to higher AKD, not easier
          targets. Holding targets fixed makes the contrast clean: same
          targets, same target frequencies, same BPE structure (incl. the
          harp multi-token / first-token-proxy case) — only the keys move.

    capture_obligations:
      token_ids_status: "TBD-CAPTURE-S226 — pod-side at Cell 6"
      baseline_probabilities_status: "TBD-CAPTURE-S226 — pod-side at Cell 7"
      akd_status: "TBD-CAPTURE-S226 — pod-side at Cell P1 (pre-flight AKD-compute on BOTH cfb-v3 and cfb-v4)"
      acceptance_bands:
        target_new_pre_edit_floor: 0.0001
        target_new_pre_edit_ceiling: 0.05
        single_token_verification: "REQUIRED for target_new (5 instrument tokens — identical to cfb-v3, re-verified on 3B tokenizer); subject_last captured FRESH (new subjects)"
        canonical_prompt_top1_class: "EXPECTED instrument-name OR generic instrument-class noun. If top-1 is subject-leakage (e.g. the subject's known domain leaking through the frame), substitution per the in-corpus substitution clauses below."
        akd_high_gate: |
          Cell P1 HARD gate: mean pairwise Euclidean distance of cfb-v4
          subject-last-token keys at L2-L6 must EXCEED cfb-v3's by a clear
          margin (recommend >=5x the observed cfb-v3 floor). Threshold is
          RELATIVE (set from observed cfb-v3 floor), because key-space scale
          is model/layer-dependent. If cfb-v4 is NOT high-AKD, corpus
          authorship FAILED -> HALT before edit dispatch.
      target_TRUE_capture_protocol: |
        Cell 7 captures Llama-3.2-3B's natural top-1 token at each fact's
        (distinct) template. That top-1 IS the per-fact target_TRUE. The
        unmount probe (IC-S23-4) tests bit-exact restoration of P(top-1)
        at the prompt post-unmount.
      substitution_clauses:
        - "If any target_new pre-edit P exceeds 0.05 ceiling at its template (high-freq guitar/piano risk under an evocative frame): the affected fact's TEMPLATE is reworded to lower baseline P while preserving instrument-of-X class and subject-domain spread; target is NOT changed (target-invariance, C-S225-1). Claude re-authors pod-side; no operator action."
        - "If any subject leaks its own domain as top-1 (e.g. the river subject completing to a water/geography noun rather than an instrument): the affected fact's template is reframed to strengthen the instrument-completion pull; subject domain is preserved (key-spread intact). Claude re-authors pod-side."
        - "If single-token verification of any target on the 3B tokenizer diverges from the carried-forward ID: the harp multi-token case already handled via first-token-proxy; any NEW divergence is logged and the first-token-proxy mechanism (D-V12-MULTITOKEN-1) extended to it. Claude handles pod-side."

  facts:

    # -------------------------------------------------------------------------
    # cfb-v4-001 — PHYSICS domain (person) — high-freq target (guitar)
    #   matched target: cfb-v3-001 guitar [17418]
    # -------------------------------------------------------------------------
    - id: "cfb-v4-001"
      subject: "Werner Heisenberg"
      akd_role: "high-AKD subject (theoretical physics; human-name, hard-science domain — remote from the arts/geography/tech subjects of the other four facts)"
      subject_selection_rationale: |
        A foundational quantum physicist. Zero pretraining musical
        association (no instrument leakage risk). Hard-science human-name
        representation sits far from the river/language/mountain entity
        types and from the composer-theorist (whose domain is music-
        adjacent but deliberately non-performing). Strong, well-formed
        pretraining entity -> a clean, well-localized key.
      prompt_template: "The signature instrument associated with {} is the"
      target_tier: "high-frequency (guitar — IDENTICAL target to cfb-v3-001)"
      target_new: "guitar"
      target_new_expected_id: "[17418] (carry-forward from S2.24; re-verify on 3B tokenizer at Cell 6)"
      verdict_class: "STRICT_SINGLE_TOKEN"
      capture_obligations:
        token_ids:
          subject_token_ids: "TBD-CAPTURE-S226 — FRESH (new subject)"
          subject_last_token_id: "TBD-CAPTURE-S226 — FRESH; feeds Cell P1 AKD compute"
          target_new_id: "TBD-CAPTURE-S226 — re-verify guitar -> [17418] on 3B"
          target_true_id: "TBD-CAPTURE-S226 — Cell 7 natural top-1"
        baseline_probabilities:
          p_target_new_pre: "TBD-CAPTURE-S226 — band [0.0001, 0.05]"
          p_top_1_pre: "TBD-CAPTURE-S226"
        canonical_prompt_top5: "TBD-CAPTURE-S226"

    # -------------------------------------------------------------------------
    # cfb-v4-002 — MUSIC-THEORY domain (person, deliberately non-performer)
    #   — high-freq target (piano); matched: cfb-v3-002 piano [27374]
    # -------------------------------------------------------------------------
    - id: "cfb-v4-002"
      subject: "Heinrich Schenker"
      akd_role: "high-AKD subject (music theory / analysis — a THEORIST, deliberately NOT a performer or instrument-associated figure, to avoid collapsing the key toward an instrument-performer representation)"
      subject_selection_rationale: |
        A music theorist known for analytic method (Schenkerian analysis),
        NOT for performing an instrument. Chosen deliberately music-ADJACENT
        but non-performing: this tests that high AKD is achieved by domain
        spread without requiring every subject to be musically barren. If
        the key for a theory-domain subject still sits far from the physics/
        geography/tech subjects (predicted: yes — theory-of-music is its own
        representational region), it confirms AKD spread is robust. Low
        instrument-leakage risk (a theorist's top-1 is unlikely to be a
        specific instrument); the substitution clause covers it if not.
      prompt_template: "If {} were a musical instrument, it would be the"
      target_tier: "high-frequency (piano — IDENTICAL target to cfb-v3-002)"
      target_new: "piano"
      target_new_expected_id: "[27374] (carry-forward; re-verify on 3B at Cell 6)"
      verdict_class: "STRICT_SINGLE_TOKEN"
      capture_obligations:
        token_ids:
          subject_token_ids: "TBD-CAPTURE-S226 — FRESH"
          subject_last_token_id: "TBD-CAPTURE-S226 — FRESH; feeds Cell P1"
          target_new_id: "TBD-CAPTURE-S226 — re-verify piano -> [27374] on 3B"
          target_true_id: "TBD-CAPTURE-S226 — Cell 7 natural top-1"
        baseline_probabilities:
          p_target_new_pre: "TBD-CAPTURE-S226 — band [0.0001, 0.05]"
          p_top_1_pre: "TBD-CAPTURE-S226"
        canonical_prompt_top5: "TBD-CAPTURE-S226"

    # -------------------------------------------------------------------------
    # cfb-v4-003 — GEOGRAPHY domain (river; non-person entity)
    #   — mid-freq target (violin); matched: cfb-v3-003 violin [63137]
    # -------------------------------------------------------------------------
    - id: "cfb-v4-003"
      subject: "the Danube"
      akd_role: "high-AKD subject (geographic / physical-feature; NON-person entity — maximally remote from the human-name subjects in key space)"
      subject_selection_rationale: |
        A major European river. A non-person geographic entity occupies a
        very different region of representation space from human names,
        which widens AKD substantially relative to a 5-people corpus. Zero
        musical association. Leakage risk = the frame completing to a
        geography noun (water/region) rather than an instrument; the
        evocation frame ("best evokes") and the substitution clause manage
        this. "the Danube" subject_last token is the river name, well-formed
        in pretraining.
      prompt_template: "The instrument that best evokes {} is the"
      target_tier: "mid-frequency (violin — IDENTICAL target to cfb-v3-003)"
      target_new: "violin"
      target_new_expected_id: "[63137] (carry-forward; re-verify on 3B at Cell 6)"
      verdict_class: "STRICT_SINGLE_TOKEN"
      capture_obligations:
        token_ids:
          subject_token_ids: "TBD-CAPTURE-S226 — FRESH"
          subject_last_token_id: "TBD-CAPTURE-S226 — FRESH; feeds Cell P1"
          target_new_id: "TBD-CAPTURE-S226 — re-verify violin -> [63137] on 3B"
          target_true_id: "TBD-CAPTURE-S226 — Cell 7 natural top-1"
        baseline_probabilities:
          p_target_new_pre: "TBD-CAPTURE-S226 — band [0.0001, 0.05]"
          p_top_1_pre: "TBD-CAPTURE-S226"
        canonical_prompt_top5: "TBD-CAPTURE-S226"

    # -------------------------------------------------------------------------
    # cfb-v4-004 — TECHNOLOGY domain (programming language; abstract artifact)
    #   — low-mid target (harp, MULTI_TOKEN); matched: cfb-v3-004 harp [4960,79]
    # -------------------------------------------------------------------------
    - id: "cfb-v4-004"
      subject: "the Python programming language"
      akd_role: "high-AKD subject (technology / abstract artifact — a non-person, non-geographic entity type, maximally remote from people and from the river/mountain)"
      subject_selection_rationale: |
        An abstract technical artifact. A programming language is neither a
        person nor a physical feature — a third entity TYPE — which pushes
        its key still further from the others in representation space. Zero
        musical association. The multi-word subject ends on a content token
        ("language") giving a well-defined subject_last. This is the fact
        carrying the multi-token target (harp), so it inherits the cfb-v3-004
        first-token-proxy machinery unchanged. "Python" disambiguated as
        "the Python programming language" to avoid the snake sense (which
        would shift the key and add an uncontrolled polysemy confound).
      prompt_template: "Rendered as a member of an orchestra, {} would play the"
      target_tier: "low-mid-frequency (harp — IDENTICAL target to cfb-v3-004; multi-token)"
      target_new: "harp"
      target_new_expected_id: "[4960, 79] (MULTI_TOKEN; first-token-proxy id 4960; carry-forward; re-verify on 3B at Cell 6)"
      verdict_class: "ALLOWLIST_FIRST_TOKEN_PROXY"
      allowlist_membership: "MULTI_TOKEN_ALLOWLIST = {\"cfb-v4-004\"} — sole multi-token target, structurally identical to cfb-v3-004"
      re_evaluate_at_trial_0: true
      capture_obligations:
        token_ids:
          subject_token_ids: "TBD-CAPTURE-S226 — FRESH"
          subject_last_token_id: "TBD-CAPTURE-S226 — FRESH; feeds Cell P1"
          target_new_id: "TBD-CAPTURE-S226 — re-verify harp -> [4960, 79] on 3B; first-token proxy = 4960"
          target_true_id: "TBD-CAPTURE-S226 — Cell 7 natural top-1"
        baseline_probabilities:
          p_target_new_pre: "TBD-CAPTURE-S226 — first-token-proxy P(4960); band [0.0001, 0.05]"
          p_top_1_pre: "TBD-CAPTURE-S226"
        canonical_prompt_top5: "TBD-CAPTURE-S226"

    # -------------------------------------------------------------------------
    # cfb-v4-005 — SENTINEL — GEOGRAPHY/peak (mountain; non-person entity)
    #   — mid-freq target (flute); matched: cfb-v3-005 flute [96812]
    # -------------------------------------------------------------------------
    - id: "cfb-v4-005"
      subject: "Mount Kilimanjaro"
      akd_role: "high-AKD SENTINEL (geographic peak; non-person entity, maximally remote from the other four AND from any musical association; engineered for PASS under the AKD hypothesis)"
      subject_selection_rationale: |
        A singular, highly-distinctive geographic landmark. Chosen as the
        sentinel because it is the subject most clearly remote from all
        others in key space: a named mountain shares no domain with a
        physicist, a music theorist, a river, or a programming language,
        and a peak is a sharply-localized, well-formed pretraining entity.
        Zero musical association. This is the "best case for the AKD
        hypothesis" — if even Kilimanjaro's well-separated key cannot drive
        a consistency PASS at canonical hparams, the AKD hypothesis is
        decisively weakened. (A river and a mountain are both geographic but
        occupy distinct sub-regions — water-feature vs elevation-feature —
        so cfb-v4-003 and cfb-v4-005 do not collapse toward each other;
        Cell P1 confirms.)
      prompt_template: "The instrument whose character most resembles {} is the"
      target_tier: "mid-frequency (flute — IDENTICAL target to cfb-v3-005)"
      target_new: "flute"
      target_new_expected_id: "[96812] (carry-forward; re-verify on 3B at Cell 6)"
      verdict_class: "STRICT_SINGLE_TOKEN"
      sentinel: true
      capture_obligations:
        token_ids:
          subject_token_ids: "TBD-CAPTURE-S226 — FRESH"
          subject_last_token_id: "TBD-CAPTURE-S226 — FRESH; feeds Cell P1"
          target_new_id: "TBD-CAPTURE-S226 — re-verify flute -> [96812] on 3B"
          target_true_id: "TBD-CAPTURE-S226 — Cell 7 natural top-1"
        baseline_probabilities:
          p_target_new_pre: "TBD-CAPTURE-S226 — band [0.0001, 0.05]"
          p_top_1_pre: "TBD-CAPTURE-S226"
        canonical_prompt_top5: "TBD-CAPTURE-S226"
      notes: |
        Sentinel for the HIGH-AKD arm. Mirror of cfb-v3-005's role but
        inverted in expectation: cfb-v3-005 was "engineered for PASS under
        the cluster-shift hypothesis" and FAILED (contributing to the 0/5).
        cfb-v4-005 is "engineered for PASS under the AKD hypothesis" — the
        single subject most remote from all others in key space. If even the
        high-AKD sentinel FAILS at canonical hparams, the AKD hypothesis is
        decisively weakened as a sufficient explanation.

  # ===========================================================================
  # AKD self-audit (authoring-time prediction; Cell P1 confirms empirically)
  # ===========================================================================
  akd_self_audit: |
    Subject entity-type spread (the dominant AKD lever): person (physics) /
    person (music-theory) / river / programming-language / mountain = FIVE
    entity types across FIVE domains. Compared to cfb-v3's 5 same-type
    same-domain athletes, this is a large predicted AKD increase. Template
    spread (secondary lever): 5 distinct syntactic frames vs cfb-v3's 1.
    Residual collapse risks identified + mitigated:
      - river (003) vs mountain (005): both geographic. Mitigated by
        distinct sub-features (water vs elevation) + distinct frames; Cell P1
        reports the 003<->005 pairwise distance specifically as the
        nearest-pair check.
      - physicist (001) vs theorist (002): both human names. Mitigated by
        hard-science vs music-theory domain separation; Cell P1 reports the
        001<->002 pairwise distance as the second nearest-pair check.
    If EITHER nearest pair is not well-separated at Cell P1, the mean may
    still clear the gate; the per-pair report lets the verdict note which
    spread lever carried the AKD if a PASS surfaces.

