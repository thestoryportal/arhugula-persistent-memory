ut disturbs other facts</p><p>The recorded limit: Doubles recall but disturbs other facts. This applies to the tested setup.</p><p>A general solution is not established by this row; different setups and repeat runs remain open.</p><p>A next step for this individual result is not recorded in the scoreboard results.</p></details><details><summary>Self-improving loop (experimental)</summary><p>Would this help: Self-improving loop (experimental)?</p><p>34 of 72. Promising, but may have seen test wordings; parked</p><p>The recorded limit: Promising, but may have seen test wordings; parked. This applies to the tested setup.</p><p>A general solution is not established by this row; different setups and repeat runs remain open.</p><p>A next step for this individual result is not recorded in the scoreboard results.</p></details><details><summary>Step 1: fit three wordings at once</summary><p>Would this help: Step 1: fit three wordings at once?</p><p>not scored. Solver could not fit it twice; inconclusive</p><p>The recorded limit: Solver could not fit it twice; inconclusive. This applies to the tested setup.</p><p>A general solution is not established by this row; different setups and repeat runs remain open.</p><p>A next step for this individual result is not recorded in the scoreboard results.</p></details><details><summary>Step 2: second address inside the name</summary><p>Would this help: Step 2: second address inside the name?</p><p>23 of 72 (vs 15). Small gain with side effects; no</p><p>The recorded limit: Small gain with side effects; no. This applies to the tested setup.</p><p>A general solution is not established by this row; different setups and repeat runs remain open.</p><p>A next step for this individual result is not recorded in the scoreboard results.</p></details><details><summary>Step 3: new vocabulary word per name (repeat)</summary><p>Would this help: Step 3: new vocabulary word per name (repeat)?</p><p>46, 37, 40 of 72 (vs 14). No clear answer: the two-word version could not be tested; the earlier one-word method repeated its result (provisional until you confirm)</p><p>The recorded limit: No clear answer: the two-word version could not be tested; the earlier one-word method repeated its result (provisional until you confirm). This applies to the tested setup.</p><p>A general solution is not established by this row; different setups and repeat runs remain open.</p><p>A next step for this individual result is not recorded in the scoreboard results.</p></details><details><summary>Step 5: ceiling test, first round (training, not a write)</summary><p>Would this help: Step 5: ceiling test, first round (training, not a write)?</p><p>70 of 72 (interim, one seed). Interim: training reaches 70 of 72 but disturbs nearby facts asked the same way; needs a repeat run before it counts</p><p>The recorded limit: Interim: training reaches 70 of 72 but disturbs nearby facts asked the same way; needs a repeat run before it counts. This applies to the tested setup.</p><p>A general solution is not established by this row; different setups and repeat runs remain open.</p><p>A next step for this individual result is not recorded in the scoreboard results.</p></details><details><summary>Step 4: let each fact pick its own depth</summary><p>Would it help to let each fact pick its own layer of the model, instead of spreading every fact over the same five layers?</p><p>12 of 72 reworded questions right, against 11 for the usual method in the same run. Putting every fact at one fixed layer also got 12, and a scrambled choice of layers got 10. The new version also moved one nearby-fact check slightly past its allowed limit (86.17 against at least 87.0).</p><p>This particular way of choosing a layer (one score, one choice of layers, one try, 24 facts) is not taken forward: it did not beat the fixed-layer or scrambled versions, and its gain of 1 is far below the 10 we required in advance.</p><p>Whether depth matters at all, whether a different way of choosing layers would work, and whether the choice of layers would come out the same with different background sentences (not measured). One small observation: a single fixed layer matched the usual method while changing the model about two-thirds as much.</p><p>None for this idea now. The ceiling test&#39;s repeat run (step 5) is running; steps 6 and 7 wait for its result.</p></details><details><summary>Step 5: ceiling test, official reading (training, not a write)</summary><p>Can training the same five layers the write method uses (not a write, just a measuring stick) get made-up two-word names right when the question is reworded, and do so without disturbing anything else?</p><p>Yes on recall, no on side effects. Two separate training runs answered 70 and 71 of 72 reworded questions right (the usual write method gets 9 to 16 across the same checks), and a repeat of the first run gave 70 again. But on both runs, other made-up names asked in the same training wordings were pulled toward the taught answers (15 of the 20 wordings over the limit), and one run lost 6 of 200 general-knowledge questions against a limit of 4.</p><p>That these five layers are too small to hold the names: training reached 70 of 72 there. It does not rule out anything about write methods, because training is not a way to store facts in this design.</p><p>Whether any method can reach the goal on this part of the model without side effects: no run here was clean on every check, so there is no clean reference number to compare other methods against. A bigger training setting was not run, because the rules set in advance skip it after this kind of result.</p><p>Steps 6 and 7 go ahead on their own plans, without a reference number from this test.</p></details><details><summary>Step 6: two ways to prepare the answer before writing it</summary><p>Before the usual write puts a fact into the model, it first works out the answer the model should give. Can two published ways of working out that answer better make the write recall made-up two-word names when the question is reworded?</p><p>No. Re-weighting the words of the answer (an idea from a paper called OverTone) answered 17 of 72 reworded questions right, against 12 for the usual method in the same run; the rules set in advance needed far more. The second idea (from a paper on &#39;forward replay&#39;) made the ordinary control facts worse, 64 and 65 of 72 against the 68 they must keep, so its own score (9 of 72) is not read.</p><p>These two specific packages, as set up here, as a way forward on this test. It does not rule out preparing the answer differently, other settings of either idea, or the ideas themselves elsewhere.</p><p>Why the second idea hurt the control facts: the run records that it put almost all of its change into the first of the five layers, but that does not show the cause.</p><p>Step 7 (measuring the best single weight change directly) when the machine has enough free memory; ASTRA attempt 3 is running now.</p></details>
